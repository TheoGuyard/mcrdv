# One run of the smoke check: the smallest catalogue, the shallowest preset that
# still enters the genetic loop (0 and 1 set max_iter = 0). Not a paper result --
# this exists so the pipeline can be exercised end to end in about a minute.
name: smoke
description: Pipeline check on the smallest catalogues.

seed: 0

instance: {name: cosmos1408, num_chasers: 4, max_load: 2, max_time: 365d}

transfer: {type: qlaw}
schedule: {type: dp}
sequence: {type: hgs, preset: 2}

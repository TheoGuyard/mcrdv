source:
  folder: results
  select:
    instance.name: iridium33
    instance.num_chasers: 15
    instance.max_load: 10
    instance.max_time: 365d

figures:
  - name: raan
    draw: raan
    reduce: raw
    legend: false
    xlabel: time [days]
    ylabel: RAAN [deg]
    xname: time_days

  - name: timeline
    draw: timeline
    reduce: raw
    legend: false
    xlabel: time [days]
    ylabel: chaser
    xname: start_days

  - name: load
    draw: load
    reduce: raw
    xlabel: chaser
    ylabel: targets collected
    xname: chaser_index

  - name: cost_time
    draw: cost_time
    reduce: raw
    xlabel: mission duration [days]
    ylabel: chaser cost
    xname: duration_days

  - name: spread
    draw: spread
    reduce: raw
    xlabel: RAAN spread [deg]
    ylabel: cost per target
    xname: raan_spread_deg

  - name: legs
    draw: legs
    reduce: raw
    x_scale: log
    xlabel: leg cost
    ylabel: share of legs [%]
    xname: leg_cost

name: convergence
description: Incumbent cost against elapsed search time.

seed: 0

instance:
  name: iridium33
  num_chasers: 15
  max_load: 10
  max_time: 365d

solver:
  type: mcrdv
  args:
    transfer: {type: qlaw}
    schedule: {type: dp}
    sequence:
      type: hgs
      args:
        preset: 5
        max_time: 5m
        log_save: true    # must be true to produce the plot
        log_iter: 1       # value closer to 1 improve the plot resolution

source:
  folder: results
  select: {instance.name: iridium33}

figures:
  - name: progress
    draw: progress
    reduce: raw
    xlabel: time [days]
    ylabel: targets collected
    xname: days

  - name: rhythm
    draw: rhythm
    reduce: raw
    xlabel: what a transfer costs
    ylabel: days per active chaser
    xname: oracle

  - name: waits
    draw: waits
    reduce: raw
    xlabel: one wait [days]
    ylabel: share of legs at or below [%]
    xname: wait_days

  - name: legs
    draw: legs
    reduce: raw
    xlabel: leg delta-v [m/s]
    ylabel: share of legs at or below [%]
    xname: leg_dv

  - name: spread
    draw: spread
    reduce: raw
    xlabel: spread of a chaser's targets in RAAN [deg]
    ylabel: share of chasers at or below [%]
    xname: spread_deg

  - name: load
    draw: load
    reduce: raw
    xlabel: chasers, heaviest first
    ylabel: targets collected
    xname: rank

  - name: priority
    draw: priority
    reduce: raw
    xlabel: what a transfer costs
    ylabel: mean position in the tour
    xname: oracle

  - name: blackout
    draw: blackout
    source:
      select:
        oracle: [fuel, blackout]
    reduce: raw
    xlabel: phase within the cycle [days]
    ylabel: departures
    xname: phase_days

  - name: weighting
    draw: weighting
    source:
      select:
        oracle: [fuel, arrival]
    reduce: raw
    x_scale: log
    xlabel: weight on arrival time [m/s per day]
    ylabel: relative to the delta-v-only plan
    xname: weight

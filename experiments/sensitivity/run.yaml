name: sensitivity
description: One instance parameter at a time, on generated debris clouds.
seed: 0

instance:
  name: synthetic
  num_targets: 200
  num_chasers: 40
  max_load: 10
  max_time: 365d
  draw: 0
  cloud:
    altitude_km: 850
    inclination_deg: 98.8
    kick: 50
    age: 3y

solver:
  type: mcrdv
  args:
    transfer:
      type: qlaw
    schedule:
      type: dp
    sequence:
      type: hgs
      args:
        preset: 5
        max_time: 2m

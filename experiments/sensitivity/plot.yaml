source:
  folder: results

figures:
  - name: time_debris
    draw: time
    source:
      select:
        sweep.axis: instance.num_targets
    group_by: num_targets
    value: t_setup
    reduce: median+iqr
    y_scale: log
    xlabel: debris
    ylabel: wall clock [s]
    xname: targets

  - name: cost_per_target_debris
    draw: cost
    source:
      select:
        sweep.axis: instance.num_targets
    group_by: num_targets
    value: cost_per_target
    reduce: median+iqr
    xlabel: debris
    ylabel: mission cost per target
    xname: targets

  - name: throughput_debris
    draw: throughput
    source:
      select:
        sweep.axis: instance.num_targets
    group_by: num_targets
    value: throughput
    reduce: median+iqr
    xlabel: debris
    ylabel: iterations per second
    xname: targets

  - name: cost_spread
    draw: cost
    source:
      select:
        sweep.axis: instance.cloud.kick
    group_by: spread_deg
    value: cost
    reduce: median+iqr
    xlabel: spread of the cloud in RAAN [deg]
    ylabel: mission cost
    xname: spread_deg

  - name: cost_horizon
    draw: cost
    source:
      select:
        sweep.axis: instance.max_time
    group_by: horizon_days
    value: cost
    reduce: median+iqr
    xlabel: mission horizon [days]
    ylabel: mission cost
    xname: horizon_days

  - name: cost_load
    draw: cost
    source:
      select:
        sweep.axis: instance.max_load
    group_by: max_load
    value: cost
    reduce: median+iqr
    xlabel: targets per chaser
    ylabel: mission cost
    xname: max_load

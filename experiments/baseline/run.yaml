# One run of the baseline comparison.
#
# `ClusterSequence` partitions the catalogue by right ascension in one sweep and
# schedules each bucket: no search at all. It is the honest reference point --
# it answers "is the search earning its running time", which is the first
# question a reader will ask.
name: baseline
description: Hybrid genetic search against the RAAN-sweep construction.

seed: 0

instance: {name: iridium33, num_chasers: 15, max_load: 8, max_time: 365d}

transfer: {type: qlaw}
schedule: {type: dp}
sequence:
  type: hgs
  preset: 5
  config: {max_time: 2m}

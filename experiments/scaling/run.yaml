# One run of the scaling experiment.
#
# A wall-clock budget, not an iteration count: it is what makes a Slurm walltime
# predictable, and what keeps the largest catalogue comparable to the smallest.
name: scaling
description: Cost and running time against catalogue size, at a fixed budget.

seed: 0

instance: {name: iridium33, num_chasers: 15, max_load: 8, max_time: 365d}

transfer: {type: qlaw}
schedule: {type: dp}
sequence:
  type: hgs
  preset: 5
  config: {max_time: 2m}

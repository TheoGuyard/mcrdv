name: schedule
description: The schedule layer quality and performance.
seed: 0

instance:
  name: iridium33
  num_chasers: 15
  max_load: 10
  max_time: 365d

solver:
  type: mcrdv
  args:
    transfer:
      type: qlaw
    schedule:
      type: dp
      args:
        grid_size: 32
        use_hints: true
        allow_waiting: true

bank:
  lengths: [2, 4, 8, 12, 16]
  per_length: 20
  width: 10

reference:
  type: dp
  args:
    grid_size: 4096
    use_hints: true
    allow_waiting: true

repeats: 3

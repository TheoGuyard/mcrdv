name: sequence
description: What a preset of the search costs in time, and what it buys.
seed: 0

instance:
  name: iridium33
  num_chasers: 15
  max_load: 10
  max_time: 365d

solver:
  type: mcrdv
  args:
    transfer:
      type: qlaw
    schedule:
      type: dp
    sequence:
      type: hgs
      args:
        preset: 4
        max_time: 10m

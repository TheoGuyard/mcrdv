[package]
name = "mcrdv"
version = "0.1.0"
edition = "2021"
# No rust-version is declared: the crate is developed against current stable
# and no older toolchain has been tested against it yet.
description = "Multi-Chaser Rendezvous: active debris removal mission planning."
license = "MIT"
readme = "README.md"

[dependencies]
# Only the seedable generator and the sequence helpers are needed: the search
# is always seeded explicitly, never from the operating system, so the default
# features (OS entropy, thread-local generator, ChaCha) are turned off.
rand = { version = "0.9", default-features = false, features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[example]]
name = "simple"
path = "examples/simple.rs"

[package]
name = "scorpion"
version = "0.1.0"
edition = "2021"
description = "Active debris removal mission planner"

[dependencies]
csv = "1.3"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "scorpion"
path = "src/lib.rs"

[[bin]]
name = "scorpion"
path = "src/main.rs"

[[example]]
name = "exp"
path = "exp/exp.rs"

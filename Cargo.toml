[package]
name = "scorpion"
version = "0.0.1"
edition = "2024"
default-run = "main"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "experiment"
path = "experiments/experiment.rs"

[[bin]]
name = "convert"
path = "data/convert.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4", features = ["derive"] }
csv = { version = "1.4.0" }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
uuid = { version = "1", features = ["v4"] }

[profile.release]
debug = 1

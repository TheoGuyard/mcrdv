[package]
name = "mcrdv"
version = "0.1.0"
edition = "2021"
description = "Multi-Chaser Rendezvous: active debris removal mission planning."
license = "MIT"
readme = "README.md"

[dependencies]
rand = { version = "0.9", default-features = false, features = ["small_rng", "thread_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[example]]
name = "simple"
path = "examples/simple.rs"

[[bin]]
name = "run"
path = "experiments/run.rs"
